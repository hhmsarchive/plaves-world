<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAVE World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet"></noscript>
  <!-- Korean pixel font (if it does not load, a normal Korean font is used) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css"></noscript>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Night sky (drawn by stars.js) -->
  <canvas id="sky"></canvas>

  <!-- Question and Start button (Korean) -->
  <main class="start-box">
    <h1>ARE YOU READY TO OPEN<br>THE DOOR TO A NEW WORLD?</h1>
    <button id="startBtn">시작</button>
  </main>

  <!-- Loading screen (hidden at first) -->
  <div class="loading" id="loading">
    <p>ENTERING INTO A NEW WORLD...</p>
    <div class="bar">
      <div class="bar-fill" id="barFill"></div>
    </div>
  </div>

  <!-- White light for entering the unknown world (hidden at first) -->
  <div class="white-light" id="whiteLight"></div>

  <script src="debug.js"></script>
  <script src="stars.js"></script>
  <script src="sound.js"></script>
  <script src="script.js"></script>
</body>
</html>
